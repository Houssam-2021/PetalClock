name: Experimental APK

# Builds the experimental fingerprint-effect APK (a separate app that installs next to the normal Petal Clock)
# and publishes it as a pre-release, so the stable releases/latest download link never changes.
on:
  push:
    branches: ['claude/fingerprint-chromatic-animations-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build experimental APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleExperimental
          cp app/build/outputs/apk/experimental/app-experimental.apk petalclock-experimental.apk

      - uses: actions/upload-artifact@v4
        with:
          name: petalclock-experimental
          path: petalclock-experimental.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental
          name: Experimental (fingerprint lens + chromatic unlock)
          prerelease: true
          make_latest: false
          body: |
            Experimental build from `${{ github.ref_name }}` (${{ github.sha }}).
            Installs as a separate app ("Petal Clock Experimental"), next to the normal one.
            To go back, set the normal Petal Clock wallpaper again (or uninstall this app).
          files: petalclock-experimental.apk
