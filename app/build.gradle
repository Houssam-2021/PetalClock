plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.blurify.clockwall'
    compileSdk 36

    defaultConfig {
        applicationId "com.blurify.clockwall.reference"
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName "1.1-reference"
        // Off in the normal builds: the fingerprint lens + chromatic unlock wave only exist in the experimental APK
        buildConfigField "boolean", "CHROMATIC_FX", "false"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
        }
        // ./gradlew assembleExperimental -> a separate app (own package id) that installs next to the normal one,
        // so going back is just picking the normal Petal Clock wallpaper again
        experimental {
            initWith release
            applicationIdSuffix ".experimental"
            versionNameSuffix "-experimental"
            buildConfigField "boolean", "CHROMATIC_FX", "true"
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
