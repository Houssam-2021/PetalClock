plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.blurify.clockwall'
    compileSdk 36

    defaultConfig {
        applicationId "com.blurify.clockwall.reference"
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName "1.1-reference"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
